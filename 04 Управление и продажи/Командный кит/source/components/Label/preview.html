<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Label</title>
<style>
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
.pv { box-sizing: border-box; width: 1080px; padding: 48px 64px; display: flex; flex-direction: column; gap: 32px; }
.pv-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }

</style>
</head>
<body>

<div class="pv">
  <div class="dt-head"><span class="dt-label dt-label--acid">&gt; ИТОГИ · НЕДЕЛЯ 42</span><span class="dt-label">23.10 · 19:00 МСК</span></div>
  <div class="pv-row">
    <span class="dt-label">&gt; РАЗДЕЛ</span>
    <span class="dt-label">// ПОЯСНЕНИЕ</span>
    <span class="dt-label dt-label--acid">[OK] ГОТОВО</span>
    <span class="dt-label dt-label--alert">[!] РИСК</span>
    <span class="dt-label">→ ДАЛЬШЕ</span>
    <span class="dt-label">02 / 05</span>
  </div>
</div>

</body>
</html>
