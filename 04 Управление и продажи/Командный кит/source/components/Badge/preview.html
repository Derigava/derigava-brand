<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Badge</title>
<style>
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
.pv { box-sizing: border-box; width: 1080px; padding: 48px 64px; display: flex; flex-direction: column; gap: 32px; }
.pv-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }

</style>
</head>
<body>

<div class="pv">
  <div class="pv-row">
    <span class="dt-badge dt-badge--ok">[OK] План</span>
    <span class="dt-badge dt-badge--solid">● Новое</span>
    <span class="dt-badge dt-badge--alert">[!] Просрочка</span>
    <span class="dt-badge">● В работе</span>
    <span class="dt-badge dt-badge--muted">н/д</span>
  </div>
</div>

</body>
</html>
