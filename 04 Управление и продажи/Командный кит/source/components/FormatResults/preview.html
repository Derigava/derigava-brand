<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Итоги недели</title>
<style>
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
</style>
</head>
<body>

<div class="dt-frame dt-frame--tall">
  <div class="dt-head"><span class="dt-label dt-label--acid">&gt; ИТОГИ · НЕДЕЛЯ 42</span><span class="dt-label">12.10 — 18.10</span></div>

  <div class="dt-kpis" style="grid-template-columns: repeat(2, minmax(0, 1fr))">

  </div>
  <div class="dt-board">
    <div class="dt-board__head" style="grid-template-columns: 64px minmax(0,1fr) 120px 140px 120px"><span class="dt-label">#</span><span class="dt-label">МЕНЕДЖЕР</span><span class="dt-label">ОПЛ</span><span class="dt-label">% ПЛАНА</span><span class="dt-label">Δ</span></div>
    <div class="dt-board__row dt-board__row--leader" style="grid-template-columns: 64px minmax(0,1fr) 120px 140px 120px"><span class="dt-board__place">01</span><span class="dt-board__name">Алиса В.</span><span class="dt-board__value">14</span><span class="dt-board__value dt-muted" style="font-size:26px">116%</span><span class="dt-board__delta dt-delta dt-delta--up">3</span></div>
    <div class="dt-board__row" style="grid-template-columns: 64px minmax(0,1fr) 120px 140px 120px"><span class="dt-board__place">02</span><span class="dt-board__name">Борис Г.</span><span class="dt-board__value">11</span><span class="dt-board__value dt-muted" style="font-size:26px">92%</span><span class="dt-board__delta dt-delta dt-delta--up">1</span></div>
    <div class="dt-board__row" style="grid-template-columns: 64px minmax(0,1fr) 120px 140px 120px"><span class="dt-board__place">03</span><span class="dt-board__name">Вера Д.</span><span class="dt-board__value">9</span><span class="dt-board__value dt-muted" style="font-size:26px">75%</span><span class="dt-board__delta dt-delta dt-delta--flat">0</span></div>
    <div class="dt-board__row" style="grid-template-columns: 64px minmax(0,1fr) 120px 140px 120px"><span class="dt-board__place">04</span><span class="dt-board__name">Глеб Е.</span><span class="dt-board__value">8</span><span class="dt-board__value dt-muted" style="font-size:26px">67%</span><span class="dt-board__delta dt-delta dt-delta--down">2</span></div>
    <div class="dt-board__row" style="grid-template-columns: 64px minmax(0,1fr) 120px 140px 120px"><span class="dt-board__place">05</span><span class="dt-board__name">Дина Ж.</span><span class="dt-board__value">5</span><span class="dt-board__value dt-muted" style="font-size:26px">42%</span><span class="dt-board__delta dt-delta dt-delta--up">2</span></div>
  </div>
  <div class="dt-grow"></div>
  <div class="dt-sig">derigava_</div>
</div>

</body>
</html>
