<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Script</title>
<style>
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
.pv { box-sizing: border-box; width: 1080px; padding: 48px 64px; display: flex; flex-direction: column; gap: 32px; }
.pv-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }

</style>
</head>
<body>

<div class="pv">
  <div class="dt-script">
    <div class="dt-say"><span class="dt-say__who">Клиент</span><span class="dt-say__text">Дорого. Мы подумаем.</span></div>
    <div class="dt-say dt-say--us"><span class="dt-say__who">Ты</span><span class="dt-say__text">Понимаю. Дорого по сравнению с чем — с другим сервисом или со своими силами?</span><span class="dt-say__note">Уточняем, с чем сравнивают, а не спорим о цене.</span></div>
    <div class="dt-say"><span class="dt-say__who">Клиент</span><span class="dt-say__text">С другим сервисом.</span></div>
  </div>
</div>

</body>
</html>
