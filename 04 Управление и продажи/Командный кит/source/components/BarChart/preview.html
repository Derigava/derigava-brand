<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BarChart</title>
<style>
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
.pv { box-sizing: border-box; width: 1080px; padding: 48px 64px; display: flex; flex-direction: column; gap: 32px; }
.pv-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }

</style>
</head>
<body>

<div class="pv">
  <span class="dt-label">// ОПЛАТЫ ЗА НЕДЕЛЮ</span>
  <div class="dt-bars">
    <div class="dt-bar dt-bar--top"><span class="dt-bar__name">Алиса В.</span><div class="dt-bar__track"><div class="dt-bar__fill" style="width: 82%"></div><span class="dt-bar__val">14</span></div></div>
    <div class="dt-bar"><span class="dt-bar__name">Борис Г.</span><div class="dt-bar__track"><div class="dt-bar__fill" style="width: 64%"></div><span class="dt-bar__val">11</span></div></div>
    <div class="dt-bar"><span class="dt-bar__name">Вера Д.</span><div class="dt-bar__track"><div class="dt-bar__fill" style="width: 53%"></div><span class="dt-bar__val">9</span></div></div>
    <div class="dt-bar"><span class="dt-bar__name">Глеб Е.</span><div class="dt-bar__track"><div class="dt-bar__fill" style="width: 47%"></div><span class="dt-bar__val">8</span></div></div>
    <div class="dt-bar"><span class="dt-bar__name">Дина Ж.</span><div class="dt-bar__track"><div class="dt-bar__fill" style="width: 29%"></div><span class="dt-bar__val">5</span></div></div>
  </div>
</div>

</body>
</html>
