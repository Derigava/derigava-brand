<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Callout</title>
<style>
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
.pv { box-sizing: border-box; width: 1080px; padding: 48px 64px; display: flex; flex-direction: column; gap: 32px; }
.pv-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }

</style>
</head>
<body>

<div class="pv">
  <div class="dt-callout">
    <span class="dt-label">&gt; ИТОГ</span>
    <p class="dt-callout__text">Пакет — максимальная выгода и закрытый вопрос на весь срок.</p>
  </div>
  <div class="dt-callout dt-callout--alert">
    <span class="dt-label">[!] ВАЖНО</span>
    <p class="dt-callout__text">Один отчёт на двоих. Дубль не засчитывается.</p>
  </div>
</div>

</body>
</html>
