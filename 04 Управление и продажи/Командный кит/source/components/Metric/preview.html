<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Metric</title>
<style>
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
.pv { box-sizing: border-box; width: 1080px; padding: 48px 64px; display: flex; flex-direction: column; gap: 32px; }
.pv-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }

</style>
</head>
<body>

<div class="pv">
  <div class="dt-metric">
    <span class="dt-metric__value">112%</span>
    <span class="dt-metric__caption">плана команды за неделю 42</span>
  </div>
  <div class="dt-kpis">
    <div class="dt-kpi dt-kpi--main"><span class="dt-kpi__value">47</span><span class="dt-kpi__caption">оплат · план 42</span></div>
    <div class="dt-kpi"><span class="dt-kpi__value">31%</span><span class="dt-kpi__caption">конверсия звонок → оплата</span></div>
    <div class="dt-kpi"><span class="dt-kpi__value">1,8</span><span class="dt-kpi__caption">млн ₽ выручки</span></div>
  </div>
</div>

</body>
</html>
