name: Rebuild brand assets with public pseudonym

on:
  push:
    paths:
      - .github/workflows/rebuild-pseudonym.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '00 Основа/source/requirements.txt'
      - name: Install render dependencies
        run: |
          python -m pip install -r "00 Основа/source/requirements.txt"
          python -m playwright install --with-deps chrome
      - name: Regenerate the complete brand
        run: |
          python "00 Основа/source/render_kit.py"
          python "00 Основа/source/build.py"
          python "00 Основа/source/finalize.py"
          python "00 Основа/source/render_scenes.py"
          python "00 Основа/source/make_web.py"
          python "00 Основа/source/make_release.py"
      - name: Verify personal name is absent from text and PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          names = ('Дмитрий Горлов', 'Дмитрия Горлова', 'ДМИТРИЙ ГОРЛОВ', 'Dmitriy Gorlov', 'DMITRIY GORLOV', 'Dmitry Gorlov')
          bad = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(x in p.parts for x in ('.git', '.venv', '__pycache__', 'dist')):
                  continue
              if p.suffix.lower() in ('.png', '.jpg', '.jpeg', '.webp', '.ttf', '.woff', '.zip'):
                  continue
              if p.suffix.lower() == '.pdf':
                  doc = PdfReader(p)
                  s = str(doc.metadata or '') + ''.join(page.extract_text() or '' for page in doc.pages)
              else:
                  try: s = p.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError): continue
              if any(name.lower() in s.lower() for name in names):
                  bad.append(str(p))
          if bad:
              print('Personal name still present:', *bad, sep='\n')
              raise SystemExit(1)
          print('Public name verification passed')
          PY
      - name: Commit regenerated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate brand assets with Derigava pseudonym"
            git push
          fi
