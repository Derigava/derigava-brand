4 L 205.025 71.563 L 219.546 71.563 L 219.546 74.134 Z " fill="#171A17" stroke="none" stroke-width="1"/><rect x="222.874" y="48.723" width="15.126" height="25.412" rx="0" fill="#93432C" stroke="none" stroke-width="1"/><text x="676.600" y="62.020" font-family="JetBrains Mono" font-weight="500" font-size="11" fill="#575E55">LIFE / 01</text><text x="58.000" y="159.020" font-family="JetBrains Mono" font-weight="500" font-size="11" fill="#93432C">ЛИЧНЫЙ ОПЫТ</text><text x="58.000" y="221.520" font-family="Onest" font-weight="600" font-size="36" fill="#171A17">Ого, меня не было месяц.</text><text x="58.000" y="271.660" font-family="Onest" font-weight="400" font-size="13" fill="#575E55">Derigava / Derigava</text><text x="58.000" y="332.760" font-family="Onest" font-weight="400" font-size="18" fill="#171A17">Я сдался и заархивировал систему на мини-ПК. Это всё ещё чертовски</text><text x="58.000" y="361.760" font-family="Onest" font-weight="400" font-size="18" fill="#171A17">увлекательно, но когда тебе просто хочется послушать музыку, а вместо</text><text x="58.000" y="390.760" font-family="Onest" font-weight="400" font-size="18" fill="#171A17">этого приходится четыре часа драться с аудиокодеками и радиочипом —</text><text x="58.000" y="419.760" font-family="Onest" font-weight="400" font-size="18" fill="#171A17">становится неприятно.</text><text x="58.000" y="466.760" font-family="Onest" font-weight="400" font-size="18" fill="#171A17">Справедливости ради, иногда мне хочется драться с аудиокодеками и</text><text x="58.000" y="495.760" font-family="Onest" font-weight="400" font-size="18" fill="#171A17">радиочипом восемь часов. Это никуда не ушло.</text><text x="58.000" y="542.760" font-family="Onest" font-weight="400" font-size="18" fill="#171A17">Но тут или одно, или другое.</text><line x1="58.000" y1="1034.000" x2="736.000" y2="1034.000" stroke="#B8C1B4" stroke-width="1"/><text x="58.000" y="1064.200" font-family="JetBrains Mono" font-weight="400" font-size="10" fill="#575E55">ФРАГМЕНТ / 05.08.2026</text></svg>